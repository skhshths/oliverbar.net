<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000; /* explicit on html+body too, not just #app, so no white ever shows through on any browser's viewport rounding/mobile address-bar quirks */
    }

    #app {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    #hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    #maintenance {
      position: fixed; inset: 0; z-index: 10;
      display: none; align-items: center; justify-content: center;
      background-color: #000; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #maintenance.show { display: flex; }
    #maintenance .box { max-width: 420px; text-align: center; color: #8a8a8a; }
    #maintenance h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: 2px; color: #b0aea5; }
    #maintenance p { margin: 0; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="app"></div>

  <div id="maintenance"><div class="box"><h1>UNDER MAINTENANCE</h1><p id="maintenance-msg"></p></div></div>

  <input type="text" id="hidden-input" autocomplete="off" autofocus>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      "use strict";

      // Paste your deployed Worker URL here (same one used on the
      // hidden pages). Leave blank to use the hardcoded defaults below
      // without any global admin control.
      const API_BASE = "https://api.oliverbar.net"; // <-- paste your Worker URL here

      // Same convention as the admin page: an optional second custom
      // domain on the same Worker, used only to recognize when a custom
      // redirect points at one of our own self-serve pages (so we know
      // to mint an access token before navigating there). Leave blank
      // to fall back to API_BASE for this check too.
      const PAGES_BASE = "https://pages.oliverbar.net";

      const ACCESS_KEY = "unlockedAccess";

      // slug -> the actual filename to redirect to. The admin page can
      // rename the trigger word and toggle a slug on/off, but not
      // change which file it points to.
      const TARGETS = {
        admin:       "/x913j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        interactive: "/x923j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        portfolio:   "/x933j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        chat:        "/x943j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        games:       "/x953j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        pi:          "/x963j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        capsule:     "/x973j1029jx1209x0f28j4f23fq28jc2q938jf.html",
        console:     "/x983j1029jx1209x0f28j4f23fq28jc2q938jf.html"
      };

      // Used only if the Worker is unreachable/not configured yet, so
      // the page still works out of the box.
      const FALLBACK_CONFIG = {
        admin:       { trigger: "ADMIN",       enabled: true },
        interactive: { trigger: "interactive", enabled: true },
        portfolio:   { trigger: "portfolio",   enabled: true },
        chat:        { trigger: "chat",        enabled: true },
        games:       { trigger: "game123",     enabled: true },
        pi:          { trigger: "pi5",         enabled: true },
        capsule:     { trigger: "capsule",     enabled: true },
        console:     { trigger: "console",     enabled: true },
        custom: []
      };

      const hiddenInput = document.getElementById("hidden-input");
      let buffer = "";
      let config = FALLBACK_CONFIG;
      let maxTriggerLength = computeMaxLength(config);

      function computeMaxLength(cfg) {
        let max = 1;
        Object.keys(TARGETS).forEach(function (slug) {
          if (cfg[slug] && cfg[slug].trigger) {
            max = Math.max(max, cfg[slug].trigger.length);
          }
        });
        (cfg.custom || []).forEach(function (item) {
          if (item.trigger) max = Math.max(max, item.trigger.length);
          (item.aliases || []).forEach(function (a) { max = Math.max(max, a.length); });
        });
        return max;
      }

      function loadConfig() {
        if (!API_BASE) return;
        fetch(API_BASE + "/api/config")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            config = data;
            maxTriggerLength = computeMaxLength(config);
          })
          .catch(function (err) {
            console.error("Could not load site config, using defaults:", err);
          });
      }

      // Maintenance mode. Held in memory and refreshed on a slow timer so
      // it can flip on without anyone reloading. Enforcement is in
      // checkTriggers(); the admin trigger is always exempt so this can
      // never lock the switch away from you.
      let maintenance = { on: false, message: "" };
      // Dev bypass: a per-browser flag the admin panel sets (same origin,
      // so localStorage is shared). When on, this browser ignores
      // maintenance mode so you can test the live site while visitors are
      // held out. It's a convenience switch, not a security boundary —
      // maintenance mode isn't one either.
      function devBypass() {
        try { return localStorage.getItem("devBypass") === "1"; } catch (e) { return false; }
      }
      function loadMaintenance() {
        if (!API_BASE) return;
        fetch(API_BASE + "/api/maintenance", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (m) { maintenance = m || { on: false, message: "" }; })
          .catch(function () { /* leave last-known state; never block on a fetch error */ });
      }
      function showMaintenance() {
        const msg = (maintenance && maintenance.message) ||
          "This site is temporarily unavailable. Please check back soon.";
        const el = document.getElementById("maintenance-msg");
        if (el) el.textContent = msg;
        document.getElementById("maintenance").classList.add("show");
      }

      function resetBuffer() {
        buffer = "";
        hiddenInput.value = "";
      }

      // Fire-and-forget usage counter for the admin panel's Experimental
      // tab. Never blocks navigation on this — if it fails, nobody
      // notices but a chart later.
      function reportTriggerUse(tag) {
        if (!API_BASE) return;
        fetch(API_BASE + "/api/stats/trigger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ slug: tag })
        }).catch(function () {});
      }

      // Custom pages served from pages.oliverbar.net live on a
      // different origin than this site, so the sessionStorage guard
      // the built-in hidden pages use (set a flag here, check it there)
      // can't reach them. Instead, the Worker hands out a short-lived,
      // single-use access token right before we navigate, and refuses
      // to serve the page without a valid one — see the /page/ route
      // in the Worker for the other half of this.
      function pagesOrigin() {
        return PAGES_BASE || API_BASE;
      }

      function slugForPagesDestination(destination) {
        const base = pagesOrigin();
        if (!base) return null;
        const prefix = base + "/page/";
        if (destination.indexOf(prefix) !== 0) return null;
        return destination.slice(prefix.length);
      }

      function goToDestination(destination) {
        const slug = slugForPagesDestination(destination);
        if (!slug || !API_BASE) {
          window.location.href = destination;
          return;
        }
        fetch(API_BASE + "/api/pages/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ slug: slug })
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            const sep = destination.indexOf("?") === -1 ? "?" : "&";
            window.location.href = data.token ? (destination + sep + "t=" + encodeURIComponent(data.token)) : destination;
          })
          .catch(function () {
            window.location.href = destination;
          });
      }

      // A "random page" custom redirect ignores its stored destination
      // and asks the Worker to pick a random custom page each time it
      // fires, then goes through the normal token-mint-and-navigate flow.
      function goToRandomPage() {
        if (!API_BASE) return;
        fetch(API_BASE + "/api/pages/random")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.slug) return;
            const base = pagesOrigin();
            if (base) goToDestination(base + "/page/" + data.slug);
          })
          .catch(function () {});
      }

      // A one-time custom redirect turns itself off the moment it's
      // used — fire-and-forget, same trust level as the usage counter
      // (reaching this point already required typing the right word).
      function disableCustomOnce(id) {
        if (!API_BASE) return;
        fetch(API_BASE + "/api/config/disable-custom", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        }).catch(function () {});
      }

      function isWithinSchedule(item) {
        const now = Date.now();
        if (item.activeFrom && now < item.activeFrom) return false;
        if (item.activeUntil && now > item.activeUntil) return false;
        return true;
      }

      function matchesCustomTrigger(item) {
        if (item.trigger && buffer.endsWith(item.trigger)) return true;
        return (item.aliases || []).some(function (a) { return a && buffer.endsWith(a); });
      }

      function checkTriggers() {
        // Admin is always treated as enabled, no matter what's stored,
        // so renaming/disabling other entries can never lock you out
        // of the admin page itself (the Worker enforces this too).
        for (const slug in TARGETS) {
          const entry = config[slug];
          if (!entry) continue;
          const isEnabled = slug === "admin" ? true : entry.enabled !== false;
          if (!isEnabled) continue;
          if (entry.trigger && buffer.endsWith(entry.trigger)) {
            // Admin always gets through — it's how you turn maintenance
            // back off. Everything else stops at the maintenance screen.
            if (maintenance.on && slug !== "admin" && !devBypass()) {
              resetBuffer();
              showMaintenance();
              return;
            }
            sessionStorage.setItem(ACCESS_KEY, slug);
            reportTriggerUse(slug);
            window.location.href = TARGETS[slug];
            return;
          }
        }

        // Custom, admin-defined redirects — either a path on this same
        // site, a self-serve page on pages.oliverbar.net, a full
        // external URL, or a "random page" pick; all just work. Each
        // can also have alias trigger words, a one-time self-disable,
        // and/or a scheduled active window.
        const customList = config.custom || [];
        for (let i = 0; i < customList.length; i++) {
          const item = customList[i];
          if (!item || item.enabled === false) continue;
          if (!isWithinSchedule(item)) continue;
          if (matchesCustomTrigger(item)) {
            if (maintenance.on && !devBypass()) { resetBuffer(); showMaintenance(); return; }
            sessionStorage.setItem(ACCESS_KEY, "custom:" + item.id);
            reportTriggerUse("custom:" + item.id);
            if (item.oneTime) disableCustomOnce(item.id);
            if (item.random) {
              goToRandomPage();
            } else {
              goToDestination(item.destination);
            }
            return;
          }
        }
      }

      function refocus() {
        hiddenInput.focus();
      }

      document.addEventListener("click", refocus);
      window.addEventListener("load", refocus);
      hiddenInput.addEventListener("blur", refocus);

      document.addEventListener("keydown", function (e) {
        if (document.activeElement !== hiddenInput) {
          refocus();
        }

        if (e.key === "Enter") {
          e.preventDefault();
          resetBuffer();
          return;
        }

        if (e.key.length === 1) {
          buffer += e.key;
          if (buffer.length > maxTriggerLength) {
            buffer = buffer.slice(-maxTriggerLength);
          }
          checkTriggers();
        }
      });

      hiddenInput.addEventListener("input", function () {
        hiddenInput.value = "";
      });

      // ---------- Experimental: quiet presence ping ----------
      // No UI, no visible change — just lets the admin panel's
      // Experimental tab show a rough "how many tabs have this open
      // right now" count. Purely for fun.
      (function presenceLoop() {
        if (!API_BASE) return;
        let presenceId = sessionStorage.getItem("presenceId");
        if (!presenceId) {
          presenceId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("p" + Math.random().toString(36).slice(2));
          sessionStorage.setItem("presenceId", presenceId);
        }
        function ping() {
          // Skip background tabs entirely. This ping is only a "for fun"
          // tab count, and a forgotten background tab pinging on a timer
          // was quietly the biggest write drain on the whole site.
          if (document.hidden) return;
          fetch(API_BASE + "/api/presence/ping", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: presenceId })
          }).catch(function () {});
        }
        if (!document.hidden) ping();
        setInterval(ping, 60000);
      })();

      refocus();
      loadConfig();
      loadMaintenance();
      setInterval(loadMaintenance, 30000);
    })();
  </script>

</body>
</html>
